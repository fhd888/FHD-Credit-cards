<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FHD Finanzas | Financial Health Development</title>
  <!-- Favicon SVG FHD integrado -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23059669'/%3E%3Cstop offset='100%25' stop-color='%23022c22'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fbbf24'/%3E%3Cstop offset='100%25' stop-color='%23d97706'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 3 L42 9 V22 C42 33 24 44 24 44 C24 44 6 33 6 22 V9 Z' fill='url(%23g1)' stroke='url(%23gold)' stroke-width='2.5'/%3E%3Ctext x='24' y='27' font-family='sans-serif' font-weight='900' font-size='13' fill='%23fbbf24' text-anchor='middle'%3EFHD%3C/text%3E%3Cpath d='M15 34 L22 28 L27 31 L33 25' fill='none' stroke='%2334d399' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23059669'/%3E%3Cstop offset='100%25' stop-color='%23022c22'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fbbf24'/%3E%3Cstop offset='100%25' stop-color='%23d97706'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 3 L42 9 V22 C42 33 24 44 24 44 C24 44 6 33 6 22 V9 Z' fill='url(%23g1)' stroke='url(%23gold)' stroke-width='2.5'/%3E%3Ctext x='24' y='27' font-family='sans-serif' font-weight='900' font-size='13' fill='%23fbbf24' text-anchor='middle'%3EFHD%3C/text%3E%3Cpath d='M15 34 L22 28 L27 31 L33 25' fill='none' stroke='%2334d399' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #041a14;
      --bg-card: #092c22;
      --bg-card-elevated: #0f3d30;
      --bg-header: #031510;
      --border: #144a3b;
      --border-gold: #d97706;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --text-dim: #94a3b8;
      --gold-primary: #f59e0b;
      --gold-light: #fbbf24;
      --gold-dark: #b45309;
      --emerald-accent: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --danger: #f87171;
      --danger-bg: rgba(239, 68, 68, 0.2);
      --danger-text: #fca5a5;
      --success: #34d399;
      --success-bg: rgba(16, 185, 129, 0.2);
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-wealth: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(16, 185, 129, 0.08);
    }

    body.theme-light {
      --bg-page: #f0fdf4;
      --bg-card: #ffffff;
      --bg-card-elevated: #f8fafc;
      --bg-header: #022c22;
      --border: #cbd5e1;
      --border-gold: #b45309;
      --text-main: #0f172a;
      --text-muted: #047857;
      --text-dim: #64748b;
      --gold-primary: #b45309;
      --gold-light: #d97706;
      --emerald-accent: #059669;
      --shadow-wealth: 0 6px 18px rgba(2, 44, 34, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }

    body {
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(20, 74, 59, 0.04) 0px, rgba(20, 74, 59, 0.04) 1px, transparent 1px, transparent 12px);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease;
    }

    /* TOP BRAND BAR */
    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .fhd-logo-wrap {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.3));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title-wrap h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-main) 60%, var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
    }

    .brand-title-wrap span {
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold-primary);
      letter-spacing: 0.8px;
      display: block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switcher {
      background: var(--bg-card-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      overflow: hidden;
    }

    .lang-btn {
      background: none;
      border: none;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
      color: #041a14;
    }

    /* NAVEGACIÓN PESTAÑAS */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 0 20px;
      gap: 4px;
      scrollbar-width: none;
    }
    .nav-bar::-webkit-scrollbar { display: none; }

    .nav-item {
      padding: 14px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dim);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-item:hover { color: var(--gold-light); }
    .nav-item.active {
      color: var(--gold-light);
      border-bottom-color: var(--gold-primary);
      font-weight: 800;
      background: linear-gradient(180deg, transparent, rgba(245, 158, 11, 0.05));
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      padding: 24px 20px;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* CABECERA FINANCIERA (IDÉNTICA A LA IMAGEN CON DETALLES DE BANCA PRIVADA) */
    .navy-header {
      background: linear-gradient(135deg, var(--bg-header) 0%, #06281f 100%);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-wealth);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .navy-header::before {
      content: '';
      position: absolute;
      top: -40px;
      right: 140px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .navy-header h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f0fdf4;
    }

    .navy-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .navy-badge {
      background: rgba(4, 26, 20, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 8px 22px;
      text-align: center;
      min-width: 125px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
    }

    .navy-badge .badge-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold-light);
      font-family: var(--font-mono);
      line-height: 1;
    }

    .navy-badge .badge-txt {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-top: 4px;
      display: block;
    }

    /* CONTROLES */
    .panel-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--gold-primary); }

    .btn-group { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      color: #041a14;
      border: none;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }
    .btn-gold:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .btn-outline {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: var(--bg-card-elevated);
      border-color: var(--gold-primary);
    }

    .btn-danger { background: var(--danger); color: #fff; border: none; }

    /* TABLA */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
      box-shadow: var(--shadow-wealth);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    thead th {
      background: rgba(0, 0, 0, 0.25);
      color: var(--text-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    tbody td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      vertical-align: middle;
    }
    tbody tr:hover { background-color: rgba(245, 158, 11, 0.03); }
    tfoot td {
      background: rgba(0, 0, 0, 0.3);
      padding: 16px 18px;
      font-weight: 800;
      border-top: 2px solid var(--border);
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .font-mono { font-family: var(--font-mono); }

    .badge-promo {
      background: var(--success-bg);
      color: var(--success);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      display: inline-block;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-none { color: var(--text-dim); font-size: 0.85rem; }

    .action-icons { display: flex; justify-content: center; gap: 4px; }
    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }

    /* VISTA DE TARJETAS (CARDS VIEW) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .tc-card-item {
      background: linear-gradient(135deg, #092c22, #041a14);
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold-primary);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-wealth);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .tc-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .tc-card-name { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
    .tc-chip {
      width: 32px;
      height: 24px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      border-radius: 5px;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
    }
    .tc-card-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .tc-substat { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
    .tc-subval { font-size: 0.95rem; font-weight: 700; margin-top: 2px; }
    .tc-card-bot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-wealth);
    }
    .stat-card .sc-title { font-size: 0.72rem; text-transform: uppercase; font-weight: 800; color: var(--text-dim); letter-spacing: 0.6px; margin-bottom: 6px; }
    .stat-card .sc-val { font-size: 1.6rem; font-weight: 800; font-family: var(--font-mono); }
    .sc-val.green { color: var(--emerald-accent); }
    .sc-val.red { color: var(--danger); }
    .sc-val.gold { color: var(--gold-light); }

    /* CALENDARIO */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    .cal-cell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 90px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cal-num { font-size: 0.8rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-dim); }
    .cal-badge {
      font-size: 0.68rem;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-cut { background: rgba(245, 158, 11, 0.2); color: var(--gold-light); border-left: 2px solid var(--gold-primary); }
    .cal-pay { background: var(--danger-bg); color: var(--danger-text); border-left: 2px solid var(--danger); }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 21, 16, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 26px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { font-size: 1.25rem; font-weight: 800; color: var(--gold-light); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.75rem; text-transform: uppercase; font-weight: 800; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold-primary); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast-msg {
      background: var(--bg-header);
      color: var(--gold-light);
      border: 1px solid var(--border-gold);
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: var(--shadow-wealth);
      font-size: 0.85rem;
      font-weight: 700;
      animation: toastIn 0.25s ease-out;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-dim);
    }
    .empty-state svg { width: 44px; height: 44px; stroke: var(--text-dim); opacity: 0.5; margin-bottom: 12px; }

    @media (max-width: 768px) {
      .navy-header { flex-direction: column; align-items: flex-start; gap: 16px; }
      .navy-badge { width: 100%; text-align: left; }
      .calendar-grid { grid-template-columns: repeat(3, 1fr); }
      .form-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="fhd-logo-wrap">
        <!-- SVG Oficial FHD con Escudo y Tendencia Financiera -->
        <svg viewBox="0 0 48 48" width="44" height="44">
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#059669"/>
              <stop offset="100%" stop-color="#022c22"/>
            </linearGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="50%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <path d="M24 3 L43 9 V22 C43 34 24 45 24 45 C24 45 5 34 5 22 V9 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
          <text x="24" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12.5" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-0.5">FHD</text>
          <path d="M14 34 L21 28 L27 32 L34 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <polygon points="34,24 30.5,24.5 33.5,27.5" fill="#34d399"/>
        </svg>
      </div>
      <div class="brand-title-wrap">
        <h1>FHD Finanzas</h1>
        <span data-i18n="tagline">Financial Health Development</span>
      </div>
    </div>

    <div class="top-actions">
      <!-- Selector de Idioma -->
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-lang-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="btn-lang-en" onclick="setLang('en')">EN</button>
      </div>

      <button class="btn btn-outline" onclick="toggleTheme()" id="themeBtn" title="Tema">🌙</button>
      <button class="btn btn-outline" onclick="exportData()" title="Backup JSON">💾 <span data-i18n="backup">Respaldar</span></button>
      <label class="btn btn-outline" style="cursor: pointer;" title="Restore JSON">
        📂 <span data-i18n="restore">Restaurar</span>
        <input type="file" id="importInput" accept=".json" style="display: none;" onchange="importData(event)">
      </label>
    </div>
  </header>

  <!-- PESTAÑAS PRINCIPALES -->
  <nav class="nav-bar">
