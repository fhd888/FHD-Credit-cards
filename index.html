<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FHD Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-header: #0b132b;
      --border: #e2e8f0;
      --border-dark: #1e293b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --warning: #f59e0b;
      --warning-bg: #fef3c7;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.dark {
      --bg-body: #090d16;
      --bg-card: #131b2e;
      --bg-header: #070b14;
      --border: #222f49;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success-bg: rgba(22, 163, 74, 0.2);
      --success-text: #4ade80;
      --danger-bg: rgba(239, 68, 68, 0.2);
      --warning-bg: rgba(245, 158, 11, 0.2);
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.2s; }

    /* BARRA SUPERIOR BRAND */
    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }
    .brand-title { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

    .top-actions { display: flex; align-items: center; gap: 8px; }

    /* NAVEGACIÓN PESTAÑAS */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 0 24px;
      gap: 4px;
      scrollbar-width: none;
    }
