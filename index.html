<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FHD Finanzas | Financial Health Development</title>
  
  <!-- Favicon Vectorial Oficial FHD -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2310b981'/%3E%3Cstop offset='100%25' stop-color='%23022c22'/%3E%3C/linearGradient%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fbbf24'/%3E%3Cstop offset='100%25' stop-color='%23b45309'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 5 L88 22 V50 C88 73 50 95 50 95 C50 95 12 73 12 50 V22 Z' fill='url(%23g)' stroke='url(%23gold)' stroke-width='4'/%3E%3Ctext x='50' y='58' font-family='sans-serif' font-size='22' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='1'%3EFHD%3C/text%3E%3Ccircle cx='50' cy='74' r='4' fill='url(%23gold)'/%3E%3C/svg%3E">

  <!-- Tipografías de Alta Fidelidad -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #061410;
      --bg-card: rgba(11, 31, 26, 0.92);
      --bg-surface-elevated: #102d25;
      --bg-header: #04100d;
      --border: #163e33;
      --border-gold: #b45309;
      --text-main: #f0fdf4;
      --text-muted: #86a79d;
      --primary: #10b981;
      --primary-hover: #059669;
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --accent-blue: #38bdf8;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.16);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.16);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.light {
      --bg-body: #f4f8f6;
      --bg-card: #ffffff;
      --bg-surface-elevated: #e6f0ec;
      --bg-header: #082d22;
      --border: #d1e2db;
      --border-gold: #d97706;
      --text-main: #06241a;
      --text-muted: #4e6b62;
      --primary: #059669;
      --primary-hover: #047857;
      --gold: #d97706;
      --gold-light: #b45309;
      --success: #059669;
      --success-bg: #d1fae5;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --shadow: 0 10px 25px -5px rgba(6, 36, 26, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s, color 0.25s;
      background-image: 
        radial-gradient(rgba(16, 185, 129, 0.06) 1px, transparent 1px),
        linear-gradient(135deg, rgba(6, 20, 16, 0.95) 0%, rgba(2, 44, 34, 0.92) 100%);
      background-size: 24px 24px, cover;
      background-attachment: fixed;
    }

    /* TOP BAR */
    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .brand-wrap { display: flex; align-items: center; gap: 14px; }
    .brand-logo-svg { width: 44px; height: 44px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    .brand-title {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-main), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle { font-size: 0.72rem; color: var(--gold); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }

    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    select, input[type="month"], input[type="date"], input[type="text"], input[type="number"] {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }
    select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }

    .lang-switcher {
      display: flex;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      padding: 2px;
    }
    .lang-btn {
      padding: 5px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
    }
    .lang-btn.active { background: var(--primary); color: #fff; }

    /* NAVEGACIÓN TABS */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 0 24px;
      gap: 6px;
      scrollbar-width: thin;
    }
    .nav-item {
      padding: 13px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-item:hover { color: var(--text-main); }
    .nav-item.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }

    /* CONTENEDOR PRINCIPAL */
    main { flex: 1; padding: 22px; max-width: 1320px; width: 100%; margin: 0 auto; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: tabFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes tabFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* CARDS & GRIDS */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card {
      background-color: var(--bg-card);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .fin-header {
      background: linear-gradient(135deg, #021a14 0%, #07382c 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-gold);
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .fin-header h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; }
    .fin-header p { font-size: 0.85rem; color: #a7f3d0; margin-top: 4px; }
    .fin-badge {
      background: rgba(2, 26, 20, 0.85);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 10px 20px;
      text-align: center;
      min-width: 130px;
    }
    .fin-badge .badge-val { font-size: 1.7rem; font-weight: 800; color: var(--gold-light); font-family: var(--font-mono); line-height: 1; }
    .fin-badge .badge-lbl { font-size: 0.68rem; color: #a7f3d0; text-transform: uppercase; font-weight: 700; margin-top: 4px; display: block; }

    /* ESTADÍSTICAS RÁPIDAS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-card .sc-title { font-size: 0.74rem; text-transform: uppercase; font-weight: 800; color: var(--text-muted); letter-spacing: 0.6px; margin-bottom: 6px; }
    .stat-card .sc-val { font-size: 1.6rem; font-weight: 800; font-family: var(--font-mono); }
    .sc-val.green { color: var(--success); }
    .sc-val.red { color: var(--danger); }
    .sc-val.blue { color: var(--accent-blue); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-outline { background: var(--bg-surface-elevated); border-color: var(--border); color: var(--text-main); }
    .btn-outline:hover { background: rgba(16, 185, 129, 0.15); border-color: var(--primary); }
    .btn-danger { background: var(--danger); color: white; }

    /* TABLA Y LISTAS */
    .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow-x: auto; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    thead th { background: rgba(0, 0, 0, 0.2); color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; font-weight: 800; padding: 13px 18px; border-bottom: 1px solid var(--border); }
    tbody td { padding: 13px 18px; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
    tbody tr:hover { background: rgba(16, 185, 129, 0.04); }
    tbody tr:last-child td { border-bottom: none; }
    tfoot td { background: rgba(0, 0, 0, 0.25); padding: 15px 18px; font-weight: 800; border-top: 2px solid var(--border); }
    .font-mono { font-family: var(--font-mono); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    .item-list { list-style: none; max-height: 320px; overflow-y: auto; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .item-row:last-child { border-bottom: none; }
    .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .delete-btn:hover { color: var(--danger); background: var(--danger-bg); }

    .badge-promo { background: var(--success-bg); color: var(--success); font-size: 0.76rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-family: var(--font-mono); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-empty { color: var(--text-muted); }

    /* TARJETAS GRID VIEW */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .tc-card-item {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-surface-elevated));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tc-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .tc-chip { width: 34px; height: 24px; background: linear-gradient(135deg, #fbbf24, #b45309); border-radius: 5px; }
    .tc-card-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tc-substat { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .tc-subval { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    .tc-card-bot { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 12px; border-top: 1px dashed var(--border); }

    /* CALENDARIO MENSUAL */
    .cal-nav-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-weight: 800; font-size: 0.74rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-day-cell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 94px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cal-day-cell:hover { background: var(--bg-surface-elevated); border-color: var(--primary); transform: translateY(-1px); }
    .cal-day-cell.other-month { opacity: 0.35; }
    .cal-day-cell.today { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
    .cal-day-cell.selected { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.12); }
    .cal-day-num { font-size: 0.82rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .cal-badge { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .cal-cut { background: var(--warning-bg); color: var(--gold-light); border-left: 2px solid var(--gold); }
    .cal-pay { background: var(--danger-bg); color: #f87171; border-left: 2px solid var(--danger); }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
    .cal-dot.inc { background: var(--success); }
    .cal-dot.exp { background: var(--danger); }

    /* GRÁFICA GASTOS SVG */
    .chart-container { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
    .chart-donut { position: relative; width: 140px; height: 140px; margin: 0 auto; }
    .chart-legend { flex: 1; min-width: 220px; list-style: none; }
    .chart-legend-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; font-size: 0.84rem; border-bottom: 1px solid rgba(22, 62, 51, 0.5); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }

    /* PROGRESS BARS */
    .progress-bar-bg { background: var(--bg-surface-elevated); border-radius: 999px; height: 8px; width: 100%; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(2, 26, 20, 0.78); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; padding: 18px; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: 20px; width: 100%; max-width: 520px; padding: 26px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.74rem; text-transform: uppercase; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    /* TOAST */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 150; display: flex; flex-direction: column; gap: 8px; }
    .toast-msg { background: var(--bg-header); color: #fff; border: 1px solid var(--border-gold); padding: 12px 18px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; box-shadow: var(--shadow); animation: toastIn 0.25s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cal-day-cell { min-height: 70px; padding: 4px; }
      .form-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- BARRA DE ENCABEZADO -->
  <header class="top-bar">
    <div class="brand-wrap">
      <svg class="brand-logo-svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#022c22"/>
          </linearGradient>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#b45309"/>
          </linearGradient>
        </defs>
        <path d="M50 5 L88 22 V50 C88 73 50 95 50 95 C50 95 12 73 12 50 V22 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
        <text x="50" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">FHD</text>
        <circle cx="50" cy="74" r="4" fill="url(#goldGrad)"/>
      </svg>
      <div>
        <div class="brand-title" id="appTitle">FHD Finanzas</div>
        <div class="brand-subtitle" id="appSubtitle">
